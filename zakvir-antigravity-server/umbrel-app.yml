manifestVersion: 1
id: zakvir-antigravity-server
category: developer
name: Antigravity Server
version: "0.2.8"
tagline: Use the Antigravity IDE from your phone via Umbrel — now open, no login
icon: https://raw.githubusercontent.com/AFSlayer/antigravity-server/main/docs/assets/control-panel.png
description: >-
  Antigravity Server adds a second, mobile-optimized front door to Google Antigravity.


  It runs the official Antigravity language_server headlessly on your Umbrel and patches the desktop web bundle on-the-fly for touch devices — restoring the New Conversation (+) button, conversation kebab menu (Delete/Rename/Pin/Archive), always-visible Undo/Copy on messages, iOS keyboard fixes, and chunked streaming uploads for large files.


  v0.2.8: Open access — beginning authentication removed. Set AGY_DISABLE_AUTH=true and PROXY_AUTH_ADD=false so the app opens directly at http://umbrel.local:8767 without Umbrel or Antigravity login. Data persists under App Data: AGY_HOME, workspace, Gemini OAuth token. Egress firewall restricts outside connections to only Antigravity model APIs (generativelanguage.googleapis.com, daily-cloudcode-pa.googleapis.com, accounts.google.com, oauth2.googleapis.com, storage.googleapis.com) plus DNS/LAN — all other outbound is dropped via iptables (NET_ADMIN). The container auto-downloads language_server from Google on first start (storage.googleapis.com/antigravity-public — no redistribution).


  To re-enable auth, set AGY_DISABLE_AUTH=false and remove PROXY_AUTH_ADD. To allow other hosts, set AGY_EGRESS_ALLOW_HOSTS or AGY_EGRESS_RESTRICT=0.


  Tips: Add to Home Screen for fullscreen PWA on iOS/Android. Works behind Umbrel's app_proxy; WebSocket/SSE streaming is preserved.


releaseNotes: >-
  v0.2.8: Remove beginning authentication (AGY_DISABLE_AUTH) and lock egress.

  - No login: Umbrel proxy auth disabled (PROXY_AUTH_ADD=false) and Antigravity password bypass (AGY_DISABLE_AUTH=true)
  - Egress firewall: iptables NET_ADMIN restricts outbound to only model APIs + OAuth + DNS/LAN (configurable via AGY_EGRESS_ALLOW_HOSTS, disable via AGY_EGRESS_RESTRICT=0)
  - Base image debian:bookworm-slim (fixes Alpine musl glibc exec failure)
  - Healthcheck 180s for 163MB language_server download

