version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zakvir-antigravity-server_server_1
      APP_PORT: 8765
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/zakvir/antigravity-server:0.2.8@sha256:917747132db99fe6cca4a312b3af1f8dd2aa1aae4d54cf1d85efad2b9bf73ea4
    restart: on-failure
    user: "1000:1000"
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${APP_DATA_DIR}/data/agy-home:/data/agy-home
      - ${APP_DATA_DIR}/data/workspace:/data/workspace
      - ${APP_DATA_DIR}/data/gemini:/home/agy/.gemini
    environment:
      HOME: /home/agy
      AGY_HOME: /data/agy-home
      AGY_WORKSPACE_ROOT: /data/workspace
      AGY_PORT: 8765
      AGY_BIND: 0.0.0.0
      AGY_DISABLE_AUTH: "true"
      AGY_EGRESS_RESTRICT: "1"
      AGY_EGRESS_ALLOW_HOSTS: "generativelanguage.googleapis.com,daily-cloudcode-pa.googleapis.com,accounts.google.com,oauth2.googleapis.com,storage.googleapis.com"
      AGY_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES}
      AGY_LANGUAGE_SERVER: /data/agy-home/language_server
      AGY_PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8765/__agy/login || wget -q --spider http://127.0.0.1:8765/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
